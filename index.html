<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Procrastination Quest - Tablón</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="rpg-theme-dark">

    <header class="rpg-navbar">
        <h1 class="pixel-text-blink">⚔️ Anti-Procrastination Quest ⚔️</h1>
        <nav class="rpg-nav">
            <ul>
                <li><a href="index.html" class="rpg-nav-link active">TABLÓN</a></li>
                <li><a href="pages/personalizacion.html" class="rpg-nav-link">TU MICHI</a></li>
                <li><a href="pages/combate.html" class="rpg-nav-link">ARENA</a></li>
            </ul>
        </nav>
    </header>

    <main class="rpg-main-container dashboard-container">
        
        <aside class="rpg-sidebar" aria-label="Estado del Jugador">
            
            <section class="rpg-box">
                <h2 class="rpg-box-title">PROGRESO GLOBAL</h2>
                <div class="rpg-progress-frame">
                    <span id="main-progress-bar" class="rpg-progress-fill" style="width: 40%;"></span>
                </div>
                <p id="progress-text" class="pixel-subtext">40% Completado (2/5 Misiones)</p>
            </section>

            <section class="rpg-box current-michi-card">
                <h2 id="display-pet-name" class="michi-name-plate">MICHI_HERO</h2>
                <figure class="michi-sprite-frame pixel-border-inner">
                    <span id="pet-avatar" class="michi-sprite idle-animation">🐈</span>
                </figure>
                <table class="rpg-stat-table">
                    <tbody>
                        <tr><td>HP:</td><td><b>❤️</b> <span id="stat-hp">100</span></td></tr>
                        <tr><td>ATK:</td><td>⚔️ <span id="stat-atk">15</span></td></tr>
                        <tr><td>DEF:</td><td>🛡️ <span id="stat-def">12</span></td></tr>
                    </tbody>
                </table>
            </section>

            <section class="rpg-box text-center">
                <h2 class="rpg-box-title">RECOMPENSAS</h2>
                <button id="btn-open-chest" class="btn-pixel btn-yellow">🎁 ABRIR COFRE</button>
            </section>

        </aside>

        <section class="rpg-content-area rpg-box main-quest-board" aria-label="Tablón de Tareas">
            
            <header class="quest-board-header">
                <h2 class="pixel-heading">📌 TABLÓN DE MISIONES</h2>
                <button id="btn-open-modal" class="btn-pixel btn-green">+ NUEVA QUEST</button>
            </header>

            <nav class="rpg-tabs" aria-label="Filtros de misiones">
                <ul>
                    <li><button class="tab-item active" data-filter="all">TODAS</button></li>
                    <li><button class="tab-item" data-filter="pendiente">PENDIENTES</button></li>
                    <li><button class="tab-item" data-filter="activa">ACTIVAS</button></li>
                    <li><button class="tab-item" data-filter="completada">LOGRADAS</button></li>
                </ul>
            </nav>

            <section id="quests-list" class="quest-list-scroll">
                <article class="quest-item-card pixel-border-inner status-activa">
                    <header class="quest-info">
                        <span class="quest-badge">⚔️ ACTIVA</span>
                        <p class="quest-name-text">Estudiar Arquitectura de Computadoras</p>
                    </header>
                    <footer class="quest-actions">
                        <button class="btn-pixel btn-blue small">✔</button>
                        <button class="btn-pixel btn-red small">✖</button>
                    </footer>
                </article>
            </section>

        </section>

    </main>

    <section id="quest-modal" class="rpg-modal-overlay hidden" aria-hidden="true">
        <form id="quest-form" class="rpg-modal-box rpg-form">
            <input type="hidden" id="quest-id">
            
            <header class="rpg-modal-header">
                <h3>[ NUEVA MISIÓN ]</h3>
                <button type="button" id="btn-close-modal" class="btn-close-pixel">&times;</button>
            </header>
            
            <p class="rpg-form-group">
                <label for="quest-title">> DESCRIPCIÓN DE LA TAREA:</label>
                <input type="text" id="quest-title" class="pixel-input" required placeholder="Ej: Resolver guía de Física...">
            </p>

            <p class="rpg-form-group">
                <label for="quest-status">> ESTADO INICIAL:</label>
                <select id="quest-status" class="pixel-select">
                    <option value="pendiente">PENDIENTE ⌛</option>
                    <option value="activa">ACTIVA ⚔️</option>
                </select>
            </p>

            <footer class="rpg-form-actions">
                <button type="button" id="btn-cancel-quest" class="btn-pixel btn-red">ABORTAR</button>
                <button type="submit" class="btn-pixel btn-green">ACEPTAR QUEST</button>
            </footer>
        </form>
    </section>

    <script src="assets/js/main.js"></script>
</body>
</html>
